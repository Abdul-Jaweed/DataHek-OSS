# DataHek OSS — self-hosted deployment
# Usage: docker compose up -d --build
#   api  :8000  (OpenAPI at /docs)
#   mcp  :8001  (MCP endpoint at /mcp)
# State (SQLite db + audit jsonl) lives in the datahek-data volume.
# Optional persistent metadata: when DATAHEK_METADATA_URL is set (as below),
# connections/conversations/prompts/evaluations live in PostgreSQL and LLM
# settings survive restarts via Redis.
services:
  postgres:
    image: postgres:16-alpine
    container_name: datahek-oss-postgres
    environment:
      POSTGRES_USER: datahek
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-datahek}
      POSTGRES_DB: datahek
    ports:
      - "5433:5432"
    volumes:
      - datahek-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datahek"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: datahek-oss-redis
    ports:
      - "6380:6379"
    volumes:
      - datahek-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    container_name: datahek-oss-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      LLM_BASE_URL: ${LLM_BASE_URL:-https://opencode.ai/zen/go/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-mimo-v2.5}
      LLM_TIMEOUT_S: ${LLM_TIMEOUT_S:-120}
      DATAHEK_DB_PATH: /app/data/datahek.db
      DATAHEK_AUDIT_PATH: /app/data/datahek-audit.jsonl
      DATAHEK_METADATA_URL: postgresql://datahek:${POSTGRES_PASSWORD:-datahek}@postgres:5432/datahek
      DATAHEK_ENCRYPTION_KEY: ${DATAHEK_ENCRYPTION_KEY:-}
      DATAHEK_METADATA_REDIS_URL: redis://redis:6379/0
      DATAHEK_NEO4J_URL: ${DATAHEK_NEO4J_URL:-}
      DATAHEK_NEO4J_USER: ${DATAHEK_NEO4J_USER:-neo4j}
      DATAHEK_NEO4J_PASSWORD: ${DATAHEK_NEO4J_PASSWORD:-}
      DATAHEK_NEO4J_DATABASE: ${DATAHEK_NEO4J_DATABASE:-}
      DATAHEK_APPROVAL_ROW_LIMIT: ${DATAHEK_APPROVAL_ROW_LIMIT:-1000}
      DATAHEK_APPROVAL_SENSITIVE_TABLES: ${DATAHEK_APPROVAL_SENSITIVE_TABLES:-}
      DATAHEK_SCHEDULER_POLL_SECONDS: ${DATAHEK_SCHEDULER_POLL_SECONDS:-30}
      DATAHEK_SUGGESTIONS: ${DATAHEK_SUGGESTIONS:-off}
      DATAHEK_VERIFIER: ${DATAHEK_VERIFIER:-on}
      DATAHEK_ANALYST: ${DATAHEK_ANALYST:-on}
      DATAHEK_GUARDRAIL_INPUT: ${DATAHEK_GUARDRAIL_INPUT:-on}
      DATAHEK_MASK_MODE: ${DATAHEK_MASK_MODE:-redact}
    ports:
      - "8000:8000"
    volumes:
      - datahek-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: datahek-oss-web
    depends_on:
      - api
    ports:
      - "5173:80"

  web-dev:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: Dockerfile.web.dev
    container_name: datahek-oss-web-dev
    depends_on:
      - api
    environment:
      API_PROXY_TARGET: http://api:8000
    ports:
      - "5173:5173"

  neo4j:
    profiles: ["graph"]
    image: neo4j:5-community
    container_name: datahek-oss-neo4j
    environment:
      NEO4J_AUTH: neo4j/${DATAHEK_NEO4J_PASSWORD:-datahek-graph}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - datahek-neo4j:/data

  mcp:
    build: .
    container_name: datahek-oss-mcp
    command: python -m datahek.mcp_server --transport http --host 0.0.0.0 --port 8001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      LLM_BASE_URL: ${LLM_BASE_URL:-https://opencode.ai/zen/go/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-mimo-v2.5}
      LLM_TIMEOUT_S: ${LLM_TIMEOUT_S:-120}
      DATAHEK_DB_PATH: /app/data/datahek.db
      DATAHEK_AUDIT_PATH: /app/data/datahek-audit.jsonl
      DATAHEK_METADATA_URL: postgresql://datahek:${POSTGRES_PASSWORD:-datahek}@postgres:5432/datahek
      DATAHEK_ENCRYPTION_KEY: ${DATAHEK_ENCRYPTION_KEY:-}
      DATAHEK_METADATA_REDIS_URL: redis://redis:6379/0
      DATAHEK_NEO4J_URL: ${DATAHEK_NEO4J_URL:-}
      DATAHEK_NEO4J_USER: ${DATAHEK_NEO4J_USER:-neo4j}
      DATAHEK_NEO4J_PASSWORD: ${DATAHEK_NEO4J_PASSWORD:-}
      DATAHEK_NEO4J_DATABASE: ${DATAHEK_NEO4J_DATABASE:-}
      DATAHEK_APPROVAL_ROW_LIMIT: ${DATAHEK_APPROVAL_ROW_LIMIT:-1000}
      DATAHEK_APPROVAL_SENSITIVE_TABLES: ${DATAHEK_APPROVAL_SENSITIVE_TABLES:-}
      DATAHEK_SCHEDULER_POLL_SECONDS: ${DATAHEK_SCHEDULER_POLL_SECONDS:-30}
      DATAHEK_SUGGESTIONS: ${DATAHEK_SUGGESTIONS:-off}
      DATAHEK_VERIFIER: ${DATAHEK_VERIFIER:-on}
      DATAHEK_ANALYST: ${DATAHEK_ANALYST:-on}
      DATAHEK_GUARDRAIL_INPUT: ${DATAHEK_GUARDRAIL_INPUT:-on}
      DATAHEK_MASK_MODE: ${DATAHEK_MASK_MODE:-redact}
    ports:
      - "8001:8001"
    volumes:
      - datahek-data:/app/data

volumes:
  datahek-data:
  datahek-pg:
  datahek-redis:
  datahek-neo4j:
# Prebuilt images: to run from GHCR instead of building locally, set
#   image: ghcr.io/abdul-jaweed/datahek-oss:latest
# on the api and mcp services and run 'docker compose up -d' (no --build).
