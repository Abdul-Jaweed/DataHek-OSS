[project]
name = "datahek-core"
version = "0.2.0"
description = "DataHek OSS — universal conversational data platform. Platform kernel: contracts, context, configuration, entitlements."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]