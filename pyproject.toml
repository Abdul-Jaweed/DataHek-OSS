[project]
name = "datahek-core"
version = "0.2.0"
description = "DataHek OSS — universal conversational data platform. Platform kernel: contracts, context, configuration, entitlements."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
datahek = "datahek.cli:main"

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]
llm = ["httpx>=0.27"]
clickhouse = ["clickhouse-connect>=1.6.0"]
api = ["fastapi>=0.141.1", "uvicorn>=0.30.0", "pydantic>=2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]