# DataHek web (production): static app + API reverse proxy.
# Prefix list mirrors apps/web/vite.config.ts so dev and production behave the same.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Docker embedded DNS: re-resolve the API service so recreating the API
  # container (new IP) never leaves nginx proxying a stale address.
  resolver 127.0.0.11 valid=10s ipv6=off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # API prefixes. `context/rebuilds` and `contexts` are the Context Layer routes;
  # the bare `/context` path stays a client-side page route (served by `location /`).
  location ~ ^/(auth|settings|health|ask|connections|conversations|prompts|evaluations|approvals|checkpoints|semantics|saved-queries|schedules|audit|contexts|context/rebuilds)(/|$) {
    set $api_upstream http://api:8000;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # SSE (/ask/stream) requires unbuffered proxying
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
  }
}
