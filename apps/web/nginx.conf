# DataHek web (production): static app + API reverse proxy.
# Prefix list mirrors apps/web/vite.config.ts so dev and production behave the same.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location ~ ^/(auth|settings|health|ask|connections|conversations|prompts|evaluations|approvals|checkpoints|semantics|saved-queries|schedules|audit)(/|$) {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # SSE (/ask/stream) requires unbuffered proxying
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
  }
}
